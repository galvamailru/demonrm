# Только PostgreSQL (если backend/frontend запускаете локально)
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: nrm
      POSTGRES_PASSWORD: nrm
      POSTGRES_DB: nrm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrm -d nrm"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
